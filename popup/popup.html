<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>DevSummarize Pro</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="app-container">
            <header>
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <h1>DevSummarize<span>Pro</span></h1>
                </div>
                <nav class="tabs">
                    <button class="tab-link active" data-tab="summarize">Summarize</button>
                    <button class="tab-link" data-tab="history">History</button>
                </nav>
            </header>

            <main>
                <!-- Summarize Tab -->
                <section id="summarize" class="tab-content active">
                    <div class="input-group">
                        <textarea
                            id="manualText"
                            placeholder="Paste documentation snippet or code here..."
                        ></textarea>
                        <div class="input-actions">
                            <button id="summarizeBtn" class="primary-btn">
                                Summarize Page
                            </button>
                            <button id="summarizeManualBtn" class="secondary-btn">
                                Summarize Pasted
                            </button>
                        </div>
                    </div>

                    <div class="output-container">
                        <div class="output-header">
                            <h4>Result</h4>
                            <button id="copyBtn" class="icon-btn" title="Copy to clipboard">
                                📋
                            </button>
                        </div>
                        <div id="result" class="result-area">
                            <p class="placeholder-text">Run a summary to see results here...</p>
                        </div>
                    </div>
                </section>

                <!-- History Tab -->
                <section id="history" class="tab-content">
                    <div class="history-header">
                        <h4>Recent Summaries</h4>
                        <button id="clearHistory" class="text-btn">Clear All</button>
                    </div>
                    <div id="historyList" class="history-list">
                        <!-- History items injected here -->
                    </div>
                </section>
            </main>

            <footer>
                <div class="status-bar">
                    <span id="aiStatus" class="status-dot online"></span>
                    <span id="aiLabel">Local AI Ready</span>
                </div>
                <button id="openREADME" class="text-btn">Docs & Support</button>
            </footer>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
