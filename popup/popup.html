<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>DevSummarize</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="app">
            <header>
                <div class="brand">DevSummarize</div>
                <div class="view-toggle">
                    <button id="summarizeTab" class="active">Summarize</button>
                    <button id="historyTab">History</button>
                </div>
            </header>

            <main id="summarizeView">
                <div class="input-wrapper">
                    <textarea id="manualText" placeholder="Paste snippet or code..."></textarea>
                    <div class="actions">
                        <button id="summarizeBtn">Page</button>
                        <button id="summarizeManualBtn" class="primary">Paste</button>
                    </div>
                </div>

                <div id="result" class="result">
                    <div class="empty-state">Results will appear here.</div>
                </div>
            </main>

            <main id="historyView" class="hidden">
                <div id="historyList" class="history-list"></div>
                <button id="clearHistory" class="clear-btn">Clear History</button>
            </main>

            <footer>
                <div id="aiStatus" class="status">AI ready</div>
                <button id="copyBtn">Copy</button>
            </div>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
